# react-pdf bundles the pdf.js worker via `new URL('pdfjs-dist/...', import.meta.url)`.
publicHoistPattern:
    - pdfjs-dist

# Supply-chain cooldown: refuse package versions published less than 48h ago.
minimumReleaseAge: 2880

# Security overrides for vulnerable transitive dependencies (2026-11-22 audit).
overrides:
    '@babel/core@<7.29.1': ^7.29.1
    ajv@>=8 <8.18.0: ^8.18.0
    serialize-javascript@<7.1.3: ^7.1.4

# pnpm >= 11 fails the install on unreviewed build scripts (ERR_PNPM_IGNORED_BUILDS).
# None of these are needed: canvas is an optional pdf.js dependency unused in the
# browser (and has no toolchain in the alpine image), the Sentry CLI binary is only for source-map
# upload, and unrs-resolver is an eslint dev dependency with prebuilt bindings.
allowBuilds:
    '@sentry/cli': false
    canvas: false
    unrs-resolver: false

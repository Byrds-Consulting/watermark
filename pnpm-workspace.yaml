# Supply-chain cooldown: refuse package versions published less than 48h ago.
minimumReleaseAge: 2880

# Security overrides for vulnerable transitive production dependencies (2026-11-13 audit).
overrides:
    brace-expansion@>=2 <2.1.6: ^2.1.7
    browserslist@<4.28.7: ^4.29.5
    fast-uri@<3.1.7: ^3.1.9
    minimatch@>=8 <8.0.6: ^8.0.7
    nanoid@<3.3.18: ^3.3.20
    picomatch@<2.3.2: ^2.3.2
    picomatch@>=4 <4.0.4: ^4.0.7
    postcss@<8.5.18: ^8.5.32
    rollup@<3.30.0: ^3.30.0
    sharp@<0.35.5: ^0.35.5
    source-map-js@<1.2.2: ^1.2.2

# pnpm >= 11 fails the install on unreviewed build scripts (ERR_PNPM_IGNORED_BUILDS).
# None of these are needed: canvas is aliased out in next.config.ts (and has no
# toolchain in the alpine image), the Sentry CLI binary is only for source-map
# upload, and unrs-resolver is an eslint dev dependency with prebuilt bindings.
allowBuilds:
    '@sentry/cli': false
    canvas: false
    unrs-resolver: false
